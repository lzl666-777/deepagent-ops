[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-audit"
version = "0.1.2"
description = "Verify what your AI agent claims: consistency, threshold and freshness checks for agent outputs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "agent", "audit", "verification", "reliability", "guardrails"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agent_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
